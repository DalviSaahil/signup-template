<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Register</h1>
<form id="register-form">
    <input type="text" id="name" name="name" required minlength="3" placeholder="name"><br><br>

    <input type="email" id="email" name="email" required placeholder="email"><br><br>

    <input type="password" id="password" name="password" required minlength="6" placeholder="password"><br><br>

    <button type="submit">Register</button>
</form>
</body>
<script src="register.js"></script>
</html>
